# Configuração de uma aula (pipeline aula-ra). Caminhos relativos são relativos a este arquivo.
aula:
  slug: gemini-enterprise-agentes
  tema: "Agentes de IA no Gemini Enterprise"
  publico: "Diretores da Rede Amazônica, público não técnico"
  objetivo: "Entender o que é um agente, como o Gemini Enterprise usa os dados da empresa, de onde vêm os agentes e o que exige governança"
  # opcionais (padrão: público não técnico): nivel, tom, linguagem, contexto: [curso, módulo, aula anterior...]
  # nivel: "intermediário — sabe programar"
  # tom: "técnico e direto, de dev para dev"

# Aula técnica (skill codigo-exemplo-aula): repositório testado + código nas cenas + exercícios
# exemplo:
#   dir: exemplos/minha-aula
#   checagem:
#     - {nome: instalar, cmd: npm ci}
#     - {nome: teste, cmd: npm test, timeout: 180}
#     - {nome: solucao, cmd: npm run test:solucao}

saida: /workspace/aula-ra/piloto-v2            # aula.html, clips/, aula.mp4, frames/, roteiro.json, verificacao.json
trabalho: /workspace/aula-ra/work/v2pipe       # cache, legendas, narração, projeto HyperFrames
# skills_dir: /home/box/agent-data/workflows   # padrão: pasta-mãe da skill aula-ra

# Formatos de vídeo: 16x9 (aula.mp4, 1920x1080) e/ou 9x16 (aula-9x16.mp4, 1080x1920, layout vertical
# próprio; trechos em FIT com fundo desfocado). Padrão: só 16x9.
formatos: [16x9]

videos:
  - url: https://www.youtube.com/watch?v=uDr0xdA_E_A   # Google Workspace · Gemini at Work - Lesson 6
    idiomas: "pt.*,en.*"

trechos:                                       # 2–3 trechos curtos (4–8 s) que mostram o produto
  - id: contexto
    video: uDr0xdA_E_A
    inicio: "03:03"
    fim: "03:11"
    cena: cerebro-contexto
    titulo_curto: "Gemini at Work – Lesson 6"
    mostra: "Pedido ao agente 'Daily Optimizer' para organizar o dia e a resposta com prioridades"
  - id: galeria
    video: uDr0xdA_E_A
    inicio: "03:30"
    fim: "03:37"
    cena: tres-fontes
    titulo_curto: "Gemini at Work – Lesson 6"
    mostra: "Galeria de agentes: do Google, da organização e os do próprio usuário"
  - id: escala
    video: uDr0xdA_E_A
    inicio: "05:17"
    fim: "05:26"
    cena: exemplo
    titulo_curto: "Gemini at Work – Lesson 6"
    mostra: "Agente de escala recebe 'staff the store' e devolve a tabela de turnos"
trechos_opcoes: {folga: 1.0, altura: 720, fundo_9x16: blur}   # fundo_9x16: blur ou cor "#0b1d3a"

# cache_videos: ../_cache/videos   # (opcional) transcrições compartilhadas entre aulas, por id do vídeo e versão
roteiro:
  selecao: {modo: bm25, max_tokens: 2500, janela_s: 45, contexto_trecho_s: 30, palavras_chave: []}  # só os trechos relevantes vão ao pedido
  # refazer_se_mudar: true      # entrada do roteiro mudou -> para e pede para refazer (false: só avisa)
  arquivo: roteiro.json        # escrito pelo agente (etapa roteiro), dentro de `saida`
  duracao_alvo: 95             # segundos no total, com os trechos
  palavras_max: 190            # narração (≈ 70 s a +8%)
  cenas: "7 a 8"
  # estrutura: "problema → conceito → código passo a passo → rodar e testar → erros comuns → exercício"
  # fechamento: "Na prática"          # padrão "Para lembrar"
  # documentacao: [{titulo: "Docs oficiais", url: "https://...", arquivo: _docs/pagina.md}]

narracao:                       # todos opcionais; padrões em pipeline.py (NARRACAO_PADRAO)
  voz: pt-BR-FranciscaNeural    # Francisca venceu Antonio e Thalita em WER/termos (v1.3.0)
  rate: "-5%"                   # +8% (até v1.2) soava corrido; -5% = ~135-140 palavras/min
  pausa_frase_ms: 400           # silêncio entre frases (350-500)
  pausa_paragrafo_ms: 700       # entre parágrafos (quebra de linha na narração)
  pausa_cena_ms: 950            # entre cenas
  pausa_trecho_ms: 500          # antes/depois de um trecho original
  pronuncia: {}                 # {termo: grafia falada} extra, por cima do mapa padrão (o do roteiro vence)
  termos_ingles: {modo: ingles_mesma_voz}  # padrão (decisão do Carlos, 2026-11-14): Francisca -5% com grafias de som
                                #   inglês. Opções: aportuguesar (padrão até a v1.6), emendar_en (voz_en), multilingual,
                                #   original; a emenda en-US foi testada e recusada na escuta (2026-11-14)
  whisper_modelo: small
  termos_checagem: ["Gemini Enterprise", "agentes", "agente", "Workbench", "Deep Research", "Google Workspace", "Google Drive", "OneDrive"]

marca:
  cores: {fundo: "#0b1d3a", fundo2: "#12305e", texto: "#ffffff", suave: "#b9c7e0", destaque1: "#4285f4", destaque2: "#34a853", destaque3: "#fbbc04"}
  fonte_titulo: Poppins
  fonte_texto: Inter

html:
  gsap_versao: "3.15.0"

video:
  resolucao: landscape         # 1920x1080
  hyperframes: "0.9.43"
  legenda_fonte: Inter
  legenda_tamanho: 18

video_9x16:                    # só usado se formatos inclui 9x16
  legenda_tamanho: 9           # escala libass (PlayResY 288): 9 ≈ 60 px em 1920
  legenda_margem: 48           # ≈ 320 px do pé: logo abaixo do trecho
  legenda_max_chars: 26
